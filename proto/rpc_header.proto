syntax = "proto3";

package minirpc;

// RPC 错误码
enum RpcErrorCode {
    RPC_OK = 0;
    RPC_METHOD_NOT_FOUND = 1;
    RPC_BAD_REQUEST = 2;
    RPC_INTERNAL_ERROR = 3;
    RPC_SERVER_BUSY = 4;
}

// 客户端 -> 服务端
message RpcHeader {
    string service_name = 1;
    string method_name = 2;
    uint32 args_size = 3;

    // 唯一标识一次 RPC 请求
    uint64 request_id = 4;//Protobuf 的字段编号属于线上的协议标识，已经使用过的字段编号尽量不要随便改变。
        // RPC协议魔数
    uint32 magic = 5;


    // RPC协议版本
    uint32 version = 6;
}

// 服务端 -> 客户端
message RpcResponseHeader {
    // 必须与请求中的 request_id 一致
    uint64 request_id = 1;

    RpcErrorCode error_code = 2;

    string error_message = 3;

    // 后面真正业务响应数据的长度
    uint32 payload_size = 4;
        // RPC协议魔数
    uint32 magic = 5;


    // RPC协议版本
    uint32 version = 6;
	
}
